<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Reef - Mi Acuario Vivo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="aquarium-bg" class="aquarium-canvas"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="logo-text">Pearl Reef</h2>
            <div class="user-pill">
                <span id="user-name">...</span>
                <!-- Cambio realizado: Se reemplazó el icono ⚪ por la imagen oficial -->
               <div class="balance-display" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px;">
    <img src="https://github.com/PearlReef1/PearlReef/blob/main/assets/perla_economia.png?raw=true" 
         alt="Perla" 
         style="width: 24px; height: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">
    <span id="pearl-balance" style="font-size: 1.1rem; font-weight: bold;">0</span> 
    <span style="font-size: 0.8rem; margin-left: 2px; opacity: 0.8;">PRL</span>
</div>
                
                <!-- Inventario de comida actualizado con Plancton y Restos Marinos -->
                <div class="food-inventory-mini" style="margin-top: 10px; font-size: 0.75rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;">
                    <span title="Plancton">🦠 <span id="food-plancton-count">0</span></span>
                    <span title="Algas">🌿 <span id="food-basic-count">0</span></span>
                    <span title="Cebos">🦐 <span id="food-rare-count">0</span></span>
                    <span title="Restos Marinos" style="color: #94a3b8;">⚓ <span id="marine-trash-count">0</span></span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-btn active" onclick="switchTab('acuario', this)">🌊 Acuario</button>
            <button class="nav-btn" onclick="switchTab('inventario', this)">🎒 Inventario</button>
            <button class="nav-btn" onclick="switchTab('tienda', this)">🛒 Tienda</button>
            <!-- Nuevo botón para activar el minijuego de pesca -->
            <button class="nav-btn" onclick="openFishingGame()" style="color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); margin-top: 5px; background: rgba(251, 191, 36, 0.05);">🎣 Pescar</button>
        </nav>

        <button onclick="handleLogout()" class="btn-logout">Salir del Mar</button>
    </aside>

    <main class="content-panel" id="content-panel" style="display: none;">
        <div class="panel-header">
            <h2 id="panel-title">Inventario</h2>
            <button class="close-panel" onclick="closeAllPanels()">×</button>
        </div>
        
        <div id="panel-body" class="panel-body">
            <!-- Contenido dinámico desde dashboard-logic.js -->
        </div>
    </main>

    <!-- Modal Multi-propósito: Se usa para alimentar y para el minijuego de pesca -->
    <div id="minigame-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" id="modal-dynamic-content">
            <!-- El JS inyectará aquí el Selector de Comida o la Interfaz de Pesca -->
            <h2>Cargando...</h2>
        </div>
    </div>

    <div id="egg-info-tooltip" class="egg-tooltip"></div>

    <script src="dashboard-logic.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Reef - Mi Acuario Vivo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="aquarium-bg" class="aquarium-canvas"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="logo-text">Pearl Reef</h2>
            <div class="user-pill">
                <span id="user-name">...</span>
                <div class="balance-display">⚪ <span id="pearl-balance">0</span> PRL</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-btn active" onclick="switchTab('acuario', this)">🌊 Acuario</button>
            <button class="nav-btn" onclick="switchTab('inventario', this)">🎒 Inventario</button>
            <button class="nav-btn" onclick="switchTab('tienda', this)">🛒 Tienda</button>
        </nav>

        <button onclick="handleLogout()" class="btn-logout">Salir del Mar</button>
    </aside>

    <main class="content-panel" id="content-panel" style="display: none;">
        <div class="panel-header">
            <h2 id="panel-title">Inventario</h2>
            <button class="close-panel" onclick="closeAllPanels()">×</button>
        </div>
        <div id="panel-body" class="panel-body">
            </div>
    </main>

    <div id="minigame-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2>¡Hora de comer!</h2>
            <p>Haz clic rápido en la comida</p>
            <div id="game-target" class="food-icon" onclick="completeFeeding()">🦐</div>
        </div>
    </div>

    <div id="egg-info-tooltip" class="egg-tooltip"></div>

    <script src="dashboard-logic.js"></script>
</body>
</html>

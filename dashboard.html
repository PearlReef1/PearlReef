<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Reef - Mi Arrecife</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="header-stats">
        <div>🌊 <span id="user-name">Cargando...</span></div>
        <div class="pearl-count">⚪ <span id="pearl-balance">0</span> PRL</div>
        <button onclick="handleLogout()" class="btn-logout">Salir</button>
    </div>

    <div id="aquarium" class="aquarium-grid">
        </div>

    <div class="shop-bar">
        <button onclick="buyEgg('Arrecife', 1000)">
            <strong>Huevo Arrecife</strong><br>
            🥚 1,000 PRL ($10)<br>
            <small>Ganancia: 35 PRL/día</small>
        </button>
        <button onclick="buyEgg('Abisal', 2500)" style="background: #fb8500;">
            <strong>Huevo Abisal</strong><br>
            🥚 2,500 PRL ($25)<br>
            <small>Ganancia: 85 PRL/día</small>
        </button>
        <button onclick="buyEgg('Ancestral', 6000)" style="background: #ffb703;">
            <strong>Huevo Ancestral</strong><br>
            🥚 6,000 PRL ($60)<br>
            <small>Ganancia: 205 PRL/día</small>
        </button>
    </div>

    <div id="minigame-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; flex-direction:column; z-index:2000; text-align: center;">
        <h2 id="game-task" style="margin-bottom: 20px;">¡Hora de comer!</h2>
        <p>Haz clic en el Cangrejo para alimentar a tu pez</p>
        <div id="game-target" style="font-size: 6rem; cursor:pointer; transition: transform 0.1s;" onclick="completeFeeding()">🦀</div>
    </div>

    <script src="dashboard-logic.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearl Reef - Mi Acuario Vivo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="aquarium-bg" class="aquarium-canvas"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="logo-text" style="margin-bottom: 20px;">Pearl Reef</h2>
            
            <!-- Contenedor de Perfil del Usuario Estilizado -->
            <div class="user-profile-box" style="background: rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 15px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                
                <!-- Nombre con Emoji de Perfil -->
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                    <div style="background: #3b82f6; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);">
                        👤
                    </div>
                    <span id="user-name" style="font-weight: 600; font-size: 0.95rem; color: #f8fafc; letter-spacing: 0.5px;">...</span>
                </div>

                <!-- Balance de Perlas -->
                <div class="balance-display" style="display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.2); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);">
                    <img src="https://github.com/PearlReef1/PearlReef/blob/main/assets/perla_economia.png?raw=true" 
                         alt="Perla" 
                         style="width: 28px; height: 28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
                    <div>
                        <span id="pearl-balance" style="font-size: 1.2rem; font-weight: 800; color: #fff; display: block; line-height: 1;">0</span>
                        <span style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">$PRL Tokens</span>
                    </div>
                </div>
                
                <!-- Inventario de comida rápido -->
                <div class="food-inventory-mini" style="margin-top: 15px; display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1);">
                    <span title="Plancton" style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem;">🦠 <span id="food-plancton-count" style="font-weight: bold;">0</span></span>
                    <span title="Algas" style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem;">🌿 <span id="food-basic-count" style="font-weight: bold;">0</span></span>
                    <span title="Cebos" style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem;">🦐 <span id="food-rare-count" style="font-weight: bold;">0</span></span>
                    <span title="Restos Marinos" style="display: flex; align-items: center; gap: 4px; font-size: 0.8rem; opacity: 0.6;">⚓ <span id="marine-trash-count">0</span></span>
                </div>
            </div>
        </div>

       <nav class="sidebar-nav">
    <button class="nav-btn active" onclick="switchTab('acuario', this)">🌊 Acuario</button>
    <button class="nav-btn" onclick="switchTab('inventario', this)">🎒 Inventario</button>
    <button class="nav-btn" onclick="switchTab('tienda', this)">🛒 Tienda</button>
    <!-- Nuevo botón de Depósito -->
    <button class="nav-btn" onclick="switchTab('deposito', this)" style="color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3); margin-top: 5px; background: rgba(46, 204, 113, 0.05);">💰 Depósito</button>
    
    <button class="nav-btn" onclick="openFishingGame()" style="color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); margin-top: 5px; background: rgba(251, 191, 36, 0.05);">🎣 Pescar</button>
</nav>

        <button onclick="handleLogout()" class="btn-logout">Salir del Mar</button>
    </aside>

    <main class="content-panel" id="content-panel" style="display: none;">
        <div class="panel-header">
            <h2 id="panel-title">Inventario</h2>
            <button class="close-panel" onclick="closeAllPanels()">×</button>
        </div>
        
        <div id="panel-body" class="panel-body">
            <!-- Contenido dinámico desde dashboard-logic.js -->
        </div>
    </main>

    <div id="minigame-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content" id="modal-dynamic-content">
            <h2>Cargando...</h2>
        </div>
    </div>

    <div id="egg-info-tooltip" class="egg-tooltip"></div>

    <script src="dashboard-logic.js"></script>
</body>
</html>
